name: Neon cleanup

# The Neon–Vercel integration creates a database branch per preview deploy but never deletes it
on:
  pull_request:
    types: [closed]

jobs:
  delete-preview-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: neondatabase/delete-branch-action@v3.2.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/${{ github.event.pull_request.head.ref }}
          api_key: ${{ secrets.NEON_API_KEY }}
