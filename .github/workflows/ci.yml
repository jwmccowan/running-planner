name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm test

      - name: Migrations match schema
        run: |
          pnpm exec drizzle-kit generate --name ci_drift_check
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "::error::lib/db/schema.ts has changes without a migration. Run pnpm db:generate and commit the result."
            git status --porcelain -- drizzle
            exit 1
          fi

  # Builds the app and runs the Playwright tests against it (next build && next start)
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: running_planner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/running_planner_test
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps --only-shell chromium

      - run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
